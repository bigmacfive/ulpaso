[package]
name = "ulpaso"
version = "0.1.0"
description = "The open-source Ulpaso editor"
authors = ["Ulpaso contributors"]
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.90"
homepage = "https://github.com/bigmacfive/ulpaso"
repository = "https://github.com/bigmacfive/ulpaso"

[lib]
name = "ulpaso_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hound = "3.5"
fs2 = "0.4"
uuid = { version = "1", features = ["v4"] }
