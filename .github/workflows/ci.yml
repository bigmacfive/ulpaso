name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend
        run: pnpm check:frontend

      - name: Build frontend
        run: pnpm build

      - name: Verify reusable package artifact
        run: |
          package_dir="$RUNNER_TEMP/markdown-package"
          mkdir -p "$package_dir"
          pnpm --filter @ulpaso/markdown pack --pack-destination "$package_dir"
          tar -tzf "$package_dir"/ulpaso-markdown-*.tgz | grep -qx package/LICENSE

      - name: Check Rust
        run: pnpm check:rust

      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file src-tauri/Cargo.lock \
            --target-os macos \
            --target-arch aarch64

      - name: Check Python helpers
        run: pnpm test:python

      - name: Check worker logic
        run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6
          PYTHONPATH=src-tauri/resources/asr python -m unittest src-tauri/resources/asr/test_asr_worker.py src-tauri/resources/asr/test_asr_artifacts.py
