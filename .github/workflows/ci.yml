name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm ci

      - name: Test website routes
        run: npm test

      - name: Build website
        run: npm run build

      - name: Verify website artifact routes
        run: npm run test:sites

  verify:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.28.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend
        run: pnpm check:frontend

      - name: Build frontend
        run: pnpm build

      - name: Verify reusable package artifact
        run: |
          package_dir="$RUNNER_TEMP/markdown-package"
          mkdir -p "$package_dir"
          pnpm --filter @ulpaso/markdown pack --pack-destination "$package_dir"
          tar -tzf "$package_dir"/ulpaso-markdown-*.tgz | grep -qx package/LICENSE

      - name: Check Rust
        run: pnpm check:rust

      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file src-tauri/Cargo.lock \
            --target-os macos \
            --target-arch aarch64

      - name: Check Python helpers
        run: pnpm test:python

      - name: Check worker logic
        run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 tqdm==4.70.0
          PYTHONPATH=src-tauri/resources/asr python -m unittest src-tauri/resources/asr/test_asr_worker.py src-tauri/resources/asr/test_asr_artifacts.py
