name: Sign official Ulpaso release

on:
  workflow_dispatch:
    inputs:
      commercial_ref:
        description: Private commercial source ref
        required: true
        default: main
      version:
        description: Release version without the v prefix
        required: true
        default: 0.3.0

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Configure private source access
        env:
          COMMERCIAL_DEPLOY_KEY: ${{ secrets.COMMERCIAL_DEPLOY_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$COMMERCIAL_DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan github.com > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Check out private commercial source
        env:
          COMMERCIAL_REF: ${{ inputs.commercial_ref }}
        run: git clone --depth 1 --branch "$COMMERCIAL_REF" git@github.com:bigmacfive/ulpaso-commercial.git source

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.28.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: source/.nvmrc
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Confirm Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Install Python test dependencies
        run: python3 -m pip install --disable-pip-version-check numpy==2.2.6

      - name: Verify commercial source
        working-directory: source
        run: pnpm check

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/ulpaso-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build and sign application
        working-directory: source
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: pnpm tauri:build

      - name: Finalize disk image layout
        working-directory: source
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          DMG_PATH="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name 'Ulpaso_*.dmg' -print -quit)"
          test -n "$DMG_PATH"
          ./scripts/finalize-dmg-layout.sh "$DMG_PATH"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG_PATH"
          codesign --verify --verbose=4 "$DMG_PATH"

      - name: Notarize and staple disk image
        working-directory: source
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          DMG_PATH="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name 'Ulpaso_*.dmg' -print -quit)"
          test -n "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"
          ./scripts/verify-dmg.sh "$DMG_PATH" "$RELEASE_VERSION"

      - name: Create release metadata
        working-directory: source
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          DMG_PATH="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name 'Ulpaso_*.dmg' -print -quit)"
          UPDATE_ARCHIVE="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
          test -n "$DMG_PATH"
          test -n "$UPDATE_ARCHIVE"
          test -f "$UPDATE_ARCHIVE.sig"
          shasum -a 256 "$DMG_PATH" > src-tauri/target/release/bundle/dmg/SHA256SUMS.txt
          UPDATE_NAME="$(basename "$UPDATE_ARCHIVE")"
          UPDATE_URL="https://github.com/bigmacfive/ulpaso-commercial-releases/releases/download/v$RELEASE_VERSION/$UPDATE_NAME"
          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg notes "Ulpaso v$RELEASE_VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(<"$UPDATE_ARCHIVE.sig")" \
            --arg url "$UPDATE_URL" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {"darwin-aarch64": {signature: $signature, url: $url}}}' \
            > latest.json

      - name: Preserve signed release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ulpaso-commercial-${{ inputs.version }}
          path: |
            source/src-tauri/target/release/bundle/dmg/Ulpaso_*.dmg
            source/src-tauri/target/release/bundle/dmg/SHA256SUMS.txt
            source/src-tauri/target/release/bundle/macos/*.app.tar.gz
            source/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            source/latest.json
          if-no-files-found: error
          retention-days: 7
