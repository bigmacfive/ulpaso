name: Bug report
description: Report a reproducible problem in Ulpaso
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not include private documents, meeting audio, transcripts, or security vulnerabilities in a public issue.

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Mac and macOS version
      placeholder: MacBook Pro (M3), macOS 15.6
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the smallest safe example that reproduces the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private document, transcript, recording, and credential data.
          required: true
